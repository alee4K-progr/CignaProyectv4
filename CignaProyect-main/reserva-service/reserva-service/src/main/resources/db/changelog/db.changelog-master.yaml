databaseChangeLog:
  - changeSet:
      id: 1-crear-tabla-reserva
      author: cigna
      changes:
        - createTable:
            tableName: reserva
            columns:
              - column:
                  name: id_reserva
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: id_agenda
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: id_usuario
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: fecha_reserva
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: estado
                  type: VARCHAR(20)
                  defaultValue: "PENDIENTE"
                  constraints:
                    nullable: false
              - column:
                  name: observaciones
                  type: VARCHAR(500)

  - changeSet:
      id: 2-insertar-reservas
      author: cigna
      changes:
        - insert:
            tableName: reserva
            columns:
              - column: {name: id_agenda, valueNumeric: 1}
              - column: {name: id_usuario, valueNumeric: 2}
              - column: {name: fecha_reserva, valueDate: "2026-05-20 09:00:00"}
              - column: {name: estado, value: "CONFIRMADA"}
              - column: {name: observaciones, value: "Consulta de rutina"}
