databaseChangeLog:
  - changeSet:
      id: 1-crear-tabla-servicio
      author: cigna
      changes:
        - createTable:
            tableName: servicio
            columns:
              - column:
                  name: id_servicio
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: nombre
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: descripcion
                  type: VARCHAR(500)
              - column:
                  name: estado
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

  - changeSet:
      id: 2-insertar-servicios
      author: cigna
      changes:
        - insert:
            tableName: servicio
            columns:
              - column: {name: nombre, value: "Consulta Médica General"}
              - column: {name: descripcion, value: "Atención médica general para diagnóstico y tratamiento"}
              - column: {name: estado, valueBoolean: true}
        - insert:
            tableName: servicio
            columns:
              - column: {name: nombre, value: "Cardiología"}
              - column: {name: descripcion, value: "Diagnóstico y tratamiento de enfermedades del corazón"}
              - column: {name: estado, valueBoolean: true}
        - insert:
            tableName: servicio
            columns:
              - column: {name: nombre, value: "Traumatología"}
              - column: {name: descripcion, value: "Atención de lesiones musculoesqueléticas"}
              - column: {name: estado, valueBoolean: true}
        - insert:
            tableName: servicio
            columns:
              - column: {name: nombre, value: "Dermatología"}
              - column: {name: descripcion, value: "Diagnóstico y tratamiento de enfermedades de la piel"}
              - column: {name: estado, valueBoolean: true}
        - insert:
            tableName: servicio
            columns:
              - column: {name: nombre, value: "Pediatría"}
              - column: {name: descripcion, value: "Atención médica para niños y adolescentes"}
              - column: {name: estado, valueBoolean: true}
        - insert:
            tableName: servicio
            columns:
              - column: {name: nombre, value: "Oftalmología"}
              - column: {name: descripcion, value: "Diagnóstico y tratamiento de enfermedades oculares"}
              - column: {name: estado, valueBoolean: true}
        - insert:
            tableName: servicio
            columns:
              - column: {name: nombre, value: "Neurología"}
              - column: {name: descripcion, value: "Diagnóstico y tratamiento del sistema nervioso"}
              - column: {name: estado, valueBoolean: true}
        - insert:
            tableName: servicio
            columns:
              - column: {name: nombre, value: "Ginecología"}
              - column: {name: descripcion, value: "Salud del sistema reproductor femenino"}
              - column: {name: estado, valueBoolean: true}
        - insert:
            tableName: servicio
            columns:
              - column: {name: nombre, value: "Psiquiatría"}
              - column: {name: descripcion, value: "Diagnóstico y tratamiento de trastornos mentales"}
              - column: {name: estado, valueBoolean: true}
        - insert:
            tableName: servicio
            columns:
              - column: {name: nombre, value: "Endocrinología"}
              - column: {name: descripcion, value: "Diagnóstico y tratamiento del sistema endocrino"}
              - column: {name: estado, valueBoolean: true}
