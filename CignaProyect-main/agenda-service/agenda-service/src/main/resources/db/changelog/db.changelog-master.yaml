databaseChangeLog:
  - changeSet:
      id: 1-crear-tabla-agenda
      author: cigna
      changes:
        - createTable:
            tableName: agenda
            columns:
              - column:
                  name: id_agenda
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: id_usuario
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: id_servicio
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: fecha
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: hora_inicio
                  type: TIME
                  constraints:
                    nullable: false
              - column:
                  name: hora_fin
                  type: TIME
                  constraints:
                    nullable: false
              - column:
                  name: estado
                  type: VARCHAR(20)
                  defaultValue: "DISPONIBLE"
                  constraints:
                    nullable: false

  - changeSet:
      id: 2-crear-tabla-detalle-agenda
      author: cigna
      changes:
        - createTable:
            tableName: detalle_agenda
            columns:
              - column:
                  name: id_detalle
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: id_agenda
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: id_tratamiento
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: observaciones
                  type: VARCHAR(500)
              - column:
                  name: activo
                  type: BOOLEAN
                  defaultValueBoolean: true
        - addForeignKeyConstraint:
            baseTableName: detalle_agenda
            baseColumnNames: id_agenda
            referencedTableName: agenda
            referencedColumnNames: id_agenda
            constraintName: fk_detalle_agenda

