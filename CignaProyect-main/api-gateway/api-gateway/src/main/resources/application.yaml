server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: usuario-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/usuarios, /api/usuarios/**

            - id: servicio-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/servicios, /api/servicios/**

            - id: agenda-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/agendas, /api/agendas/**

            - id: reserva-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/reservas, /api/reservas/**

            - id: tratamiento-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/tratamientos, /api/tratamientos/**
